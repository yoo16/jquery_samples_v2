<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="css/gallery.css">
</head>

<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-inner">
                <h1>Cafe JS Gallery</h1>
                <p>サムネイルから写真を切り替える、実用的な商品ギャラリーです。</p>
            </div>
        </header>
        <main class="content-shell">
            <section>
                <ul class="thumb-list">
                    <li>
                        <button class="thumbnail thumb-button is-active" data-title="ストロベリーチーズケーキ"
                            data-copy="滑らかなチーズクリームと甘酸っぱいイチゴの組み合わせ。" data-index="1" type="button">
                            <img class="thumb-image" src="images/item1.jpg" alt="ストロベリーチーズケーキ">
                        </button>
                    </li>
                    <li>
                        <button class="thumbnail thumb-button" data-title="チョコレートパンケーキ"
                            data-copy="濃厚なキャラメルソースとイチゴを添えた贅沢なパンケーキ。" data-index="2" type="button">
                            <img class="thumb-image" src="images/item2.jpg" alt="チョコレートパンケーキ">
                        </button>
                    </li>
                    <li>
                        <button class="thumbnail thumb-button" data-title="チョコレートパンケーキ"
                            data-copy="キャラメルソースとチョコレートをふんだんに使用した食感のあるパンケーキ。" data-index="3" type="button">
                            <img class="thumb-image" src="images/item3.jpg" alt="チョコレートパンケーキ">
                        </button>
                    </li>
                    <li>
                        <button class="thumbnail thumb-button" data-title="ベリーパンケーキ"
                            data-copy="ふんわりしたパンケーキに甘酸っぱいベリーとシロップを添えました。" data-index="4" type="button">
                            <img class="thumb-image" src="images/item4.jpg" alt="ベリーパンケーキ">
                        </button>
                    </li>
                    <li>
                        <button class="thumbnail thumb-button" data-title="ストロベリーシフォン"
                            data-copy="ふわふわのシフォンケーキに甘いクリームと新鮮なイチゴをトッピング。" data-index="5" type="button">
                            <img class="thumb-image" src="images/item5.jpg" alt="ストロベリーシフォン">
                        </button>
                    </li>
                </ul>
            </section>
            <section class="panel">
                <div class="gallery-layout">
                    <article class="viewer-card">
                        <div class="viewer-caption">
                            <div>
                                <h3 id="main-title" class="viewer-title">ストロベリーチーズケーキ</h3>
                                <p id="main-copy" class="viewer-copy">滑らかなチーズクリームと甘酸っぱいイチゴの組み合わせ。</p>
                            </div>
                            <div id="main-count" class="viewer-count">1 / 5</div>
                        </div>
                        <div class="viewer-frame">
                            <img id="main-image" src="images/item1.jpg" alt="ストロベリーチーズケーキ">
                        </div>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <script src="js/thumbnail.js"></script>
</body>

</html>
